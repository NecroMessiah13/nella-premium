services:
  postgres:
    image: postgres:16-alpine
    container_name: nella-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nella
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nella}
      POSTGRES_DB: nella
    ports: ["5432:5432"]
    volumes: ["nella_postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nella"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DATABASE_URL: "postgresql://nella:${POSTGRES_PASSWORD:-nella}@postgres:5432/nella?schema=public"
    container_name: nella-app
    restart: unless-stopped
    working_dir: /app
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: "postgresql://nella:${POSTGRES_PASSWORD:-nella}@postgres:5432/nella?schema=public"
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@nella.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      NODE_ENV: "production"
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-http://localhost:3000/payment/success}
      SMTP_HOST: ${SMTP_HOST:-smtp.timeweb.ru}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@nellapremium.ru}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Nella Premium}
      CDEK_API_KEY: ${CDEK_API_KEY:-}
      CDEK_ACCOUNT: ${CDEK_ACCOUNT:-}
      OZON_API_KEY: ${OZON_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: caddy:2-alpine
    container_name: nella-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  nella_postgres_data:
  caddy_data:
  caddy_config: